<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catégories | Gestion de stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Gestion de stock</h1></header>
  <nav aria-label="Navigation principale">
    <a href="index.html">Tableau de bord</a>
    <a href="products.html">Produits</a>
    <a href="categories.html" aria-current="page">Catégories</a>
    <a href="suppliers.html">Fournisseurs</a>
    <a href="stock.html">Stock</a>
    <a href="sales.html">Ventes</a>
  </nav>
  <main>
    <h2>Catégories</h2>
    <p class="lead">Organisez vos produits par catégorie.</p>
    <div id="message" class="message" role="alert" hidden></div>
    <div class="grid layout">
      <section class="card">
        <h3 id="form-title">Ajouter une catégorie</h3>
        <form id="category-form" novalidate>
          <div class="field"><label for="name">Nom</label><input id="name" required maxlength="100"></div>
          <div class="field"><label for="description">Description <small>(facultatif)</small></label><textarea id="description" rows="3"></textarea></div>
          <div class="actions">
            <button class="btn" type="submit">Enregistrer</button>
            <button class="btn ghost" type="button" id="cancel-btn" hidden>Annuler la modification</button>
          </div>
        </form>
      </section>
      <section class="card">
        <h3>Liste des catégories</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Nom</th><th>Description</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div class="pager" id="pager"></div>
      </section>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
